<title>Estilos em Movimento</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..700&family=Nunito+Sans:wght@400;700;800&family=Pixelify+Sans:wght@400..700&family=Patrick+Hand&family=Baloo+2:wght@500..800&family=Lilita+One&display=swap">
<style>
/* Layout: a dark studio stage. Phone frame centered, style chips above, notes below. Single dark look on purpose so each phone screen pops. */
:root {
  --bg: #10141E;
  --panel: #192031;
  --line: #2B3449;
  --fg: #F4EFE6;
  --muted: #A6AFC2;
  --accent: #FFB35C;
  --accent-ink: #1E1405;
  --display: 'Fredoka', 'Baloo 2', system-ui, sans-serif;
  --body: 'Nunito Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  font-size: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 32px;
  -webkit-tap-highlight-color: transparent;
}
.wrap { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
header { display: flex; flex-direction: column; gap: 6px; }
.eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); font-weight: 800; }
h1 { font-family: var(--display); font-weight: 600; font-size: clamp(28px, 5vw, 44px); line-height: 1.05; margin: 0; text-wrap: balance; }
.lede { color: var(--muted); margin: 0; max-width: 62ch; line-height: 1.5; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
.chip {
  flex: none; font: 700 14px/1 var(--body); color: var(--fg); background: var(--panel);
  border: 1px solid var(--line); border-radius: 999px; padding: 10px 14px; cursor: pointer;
  display: inline-flex; gap: 8px; align-items: center;
}
.chip b { font-family: var(--display); font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.chip[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip[aria-selected="true"] b { color: var(--accent-ink); }
.chip:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.stage { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 32px; align-items: center; }
.phone {
  position: relative; height: min(80vh, 860px); aspect-ratio: 9 / 19.5; max-width: 100%;
  border-radius: 44px; background: #05070B; padding: 10px; box-shadow: 0 30px 80px rgba(0,0,0,.55), inset 0 0 0 2px #2E3446;
  touch-action: pan-y;
}
.screen { position: absolute; inset: 10px; border-radius: 34px; overflow: hidden; background: #000; isolation: isolate; }
.notch { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); width: 92px; height: 26px; border-radius: 20px; background: #05070B; z-index: 30; pointer-events: none; }
.placeholder { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--muted); font-family: var(--display); font-size: 20px; background: #161B27; }
.info { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.info .num { font-family: var(--display); color: var(--accent); font-weight: 600; font-size: 18px; }
.info h2 { font-family: var(--display); font-weight: 600; font-size: clamp(28px, 4vw, 48px); margin: 0; line-height: 1.05; }
.info p { color: var(--muted); margin: 0; line-height: 1.55; max-width: 52ch; }
.controls { display: flex; gap: 10px; flex-wrap: wrap; }
button.btn {
  font: 700 15px/1 var(--body); color: var(--fg); background: var(--panel); border: 1px solid var(--line);
  border-radius: 14px; padding: 13px 16px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
}
button.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.hint { font-size: 13px; color: var(--muted); }
.closefs { display: none; }
/* Full screen: the phone screen takes the whole viewport. */
body.full { overflow: hidden; }
body.full .phone {
  position: fixed; inset: 0; height: auto; aspect-ratio: auto; max-width: none; border-radius: 0; padding: 0; z-index: 50; box-shadow: none; background: #000;
}
body.full .screen { inset: 0; border-radius: 0; }
body.full .notch { display: none; }
body.full .closefs {
  display: inline-flex; position: fixed; z-index: 60; top: calc(10px + env(safe-area-inset-top, 0px)); right: calc(10px + env(safe-area-inset-right, 0px));
  align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(0,0,0,.55); color: #fff; font: 700 20px/1 var(--body); cursor: pointer;
}
body.full .fsnav { display: block; }
.fsnav { display: none; }
.fsnav button {
  position: fixed; z-index: 60; top: 50%; transform: translateY(-50%); width: 36px; height: 56px; border: 0; border-radius: 12px;
  background: rgba(0,0,0,.35); color: #fff; font: 700 24px/1 var(--body); cursor: pointer;
}
.fsnav #fsprev { left: calc(4px + env(safe-area-inset-left, 0px)); }
.fsnav #fsnext { right: calc(4px + env(safe-area-inset-right, 0px)); }
#fslabel { display: none; }
@media (max-width: 760px) {
  .stage { grid-template-columns: minmax(0, 1fr); justify-items: center; gap: 18px; }
  .phone { height: auto; width: min(100%, 420px); }
  .info { width: 100%; }
}
</style>

<div class="wrap">
  <header>
    <span class="eyebrow">KidsSchooling · Direção de arte</span>
    <h1>Estilos em movimento</h1>
    <p class="lede">A mesma cena em 15 estilos: o herói chega à vila, o Mestre Tomé dá uma dica e a ponte é consertada. Toque em <b>Tela cheia</b> para ver como fica no celular.</p>
  </header>

  <nav class="chips" id="chips" role="tablist" aria-label="Estilos"></nav>

  <section class="stage">
    <div class="phone" id="phone">
      <div class="screen" id="screen" aria-live="polite"></div>
      <div class="notch"></div>
      <button class="closefs" id="closefs" aria-label="Sair da tela cheia">✕</button>
      <div class="fsnav"><button id="fsprev" aria-label="Estilo anterior">‹</button><span id="fslabel"></span><button id="fsnext" aria-label="Próximo estilo">›</button></div>
    </div>
    <div class="info">
      <span class="num" id="num"></span>
      <h2 id="name"></h2>
      <p id="desc"></p>
      <div class="controls">
        <button class="btn primary" id="fs">⤢ Tela cheia</button>
        <button class="btn" id="prev">‹ Anterior</button>
        <button class="btn" id="next">Próximo ›</button>
      </div>
      <span class="hint">No celular, deslize para o lado para trocar de estilo.</span>
    </div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="scenes/voxel.js"></script>
<script src="scenes/lowpoly.js"></script>
<script src="scenes/cartoon.js"></script>
<script src="scenes/pixel.js"></script>
<script src="scenes/isometrico.js"></script>
<script src="scenes/ilustrado.js"></script>
<script src="scenes/celshading.js"></script>
<script src="scenes/massinha.js"></script>
<script src="scenes/papel.js"></script>
<script src="scenes/pecas.js"></script>
<script src="scenes/flat.js"></script>
<script src="scenes/hd2d.js"></script>
<script src="scenes/pixel3d.js"></script>
<script src="scenes/voxelart.js"></script>
<script src="scenes/combinado.js"></script>
<script>
(function () {
  var STYLES = [
    ['voxel', 'Blocos (voxel)', 'Tudo é feito de cubos. Forte em construção e barato, mas o risco é parecer Minecraft.'],
    ['lowpoly', 'Low poly', 'Formas 3D facetadas e cores chapadas. Leve e moderno, mas pode parecer genérico.'],
    ['cartoon', 'Cartoon 3D', 'Personagens fofos e expressivos, luz suave. O que mais encanta, e o mais caro.'],
    ['pixel', 'Pixel art 2D', 'Quadradinhos como nos clássicos. Barato e charmoso, pode parecer antigo.'],
    ['isometrico', 'Isométrico (2.5D)', 'O mundo como maquete vista de cima. Ótimo para construir e gerir a vila.'],
    ['ilustrado', 'Ilustrado à mão', 'Cenários pintados como livro de histórias. Lindo no papel, fraco em construção.'],
    ['celshading', 'Cel-shading', '3D com contorno grosso e sombra chapada, cara de desenho animado.'],
    ['massinha', 'Massinha', 'Tudo parece modelado em argila. Acolhedor, ótimo para os pequenos.'],
    ['papel', 'Papel recortado', 'Camadas de papel, como teatro de dobraduras. Conversa direto com a apostila.'],
    ['pecas', 'Peças de montar', 'Tudo se encaixa como brinquedo de montar. Construção forte, precisa de peças próprias.'],
    ['flat', 'Flat 2D (vetorial)', 'Formas geométricas e cores chapadas, visual de app educativo.'],
    ['hd2d', 'HD-2D', 'Personagens em pixel art dentro de um cenário 3D com luz e desfoque de maquete.'],
    ['pixel3d', '3D pixelado', 'Mundo 3D de verdade exibido em baixa resolução, com cara de pixel art.'],
    ['voxelart', 'Voxel art detalhado', 'Pixel art esculpida em cubinhos minúsculos, como uma maquete de pixels.'],
    ['combinado', '★ Combinado (recomendado)', 'Mundo em cartoon 3D com câmera alta, construção com blocos de encaixe próprios e interface em ilustração 2D com mapa isométrico. É o vencedor da pesquisa.']
  ];
  var SCENES = window.SCENES || {};
  var chips = document.getElementById('chips');
  var screen = document.getElementById('screen');
  var current = null, idx = 0;

  STYLES.forEach(function (s, i) {
    var b = document.createElement('button');
    b.className = 'chip'; b.id = 'chip-' + s[0]; b.setAttribute('role', 'tab');
    b.innerHTML = '<b>' + (i + 1) + '</b>' + s[1];
    b.addEventListener('click', function () { go(i); });
    chips.appendChild(b);
  });

  function go(i) {
    idx = (i + STYLES.length) % STYLES.length;
    var s = STYLES[idx];
    if (current && current.destroy) { try { current.destroy(); } catch (e) {} }
    current = null;
    screen.innerHTML = '';
    var host = document.createElement('div');
    host.style.cssText = 'position:absolute;inset:0;overflow:hidden;';
    screen.appendChild(host);
    var scene = SCENES[s[0]];
    if (scene && scene.mount) {
      try { current = scene.mount(host); }
      catch (e) { host.innerHTML = '<div class="placeholder">Não foi possível carregar esta cena.</div>'; console.error(e); }
    } else {
      host.innerHTML = '<div class="placeholder">Cena em produção</div>';
    }
    document.getElementById('num').textContent = 'Estilo ' + (idx + 1) + ' de ' + STYLES.length;
    document.getElementById('name').textContent = s[1];
    document.getElementById('desc').textContent = s[2];
    document.getElementById('fslabel').textContent = (idx + 1) + ' · ' + s[1];
    Array.prototype.forEach.call(chips.children, function (c, j) {
      c.setAttribute('aria-selected', j === idx ? 'true' : 'false');
    });
    var chip = chips.children[idx];
    if (chip && chip.scrollIntoView) chip.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
    if (location.hash.slice(1) !== s[0]) { try { history.replaceState(null, '', '#' + s[0]); } catch (e) {} }
  }

  function fromHash() {
    var h = location.hash.slice(1);
    var i = STYLES.findIndex(function (s) { return s[0] === h; });
    return i < 0 ? STYLES.length - 1 : i;
  }

  function enterFull() {
    document.body.classList.add('full');
    var p = document.getElementById('phone');
    if (p.requestFullscreen) { p.requestFullscreen().catch(function () {}); }
    go(idx);
  }
  function exitFull() {
    document.body.classList.remove('full');
    if (document.fullscreenElement && document.exitFullscreen) { document.exitFullscreen().catch(function () {}); }
    go(idx);
  }
  document.addEventListener('fullscreenchange', function () {
    if (!document.fullscreenElement && document.body.classList.contains('full')) { document.body.classList.remove('full'); go(idx); }
  });

  document.getElementById('fs').addEventListener('click', enterFull);
  document.getElementById('closefs').addEventListener('click', exitFull);
  document.getElementById('prev').addEventListener('click', function () { go(idx - 1); });
  document.getElementById('next').addEventListener('click', function () { go(idx + 1); });
  document.getElementById('fsprev').addEventListener('click', function () { go(idx - 1); });
  document.getElementById('fsnext').addEventListener('click', function () { go(idx + 1); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') go(idx + 1);
    else if (e.key === 'ArrowLeft') go(idx - 1);
    else if (e.key === 'Escape' && document.body.classList.contains('full')) exitFull();
  });

  var sx = null, sy = null;
  var phone = document.getElementById('phone');
  phone.addEventListener('pointerdown', function (e) { sx = e.clientX; sy = e.clientY; });
  phone.addEventListener('pointerup', function (e) {
    if (sx === null) return;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) go(idx + (dx < 0 ? 1 : -1));
    sx = sy = null;
  });

  window.addEventListener('hashchange', function () { var i = fromHash(); if (i !== idx) go(i); });
  go(fromHash());
})();
</script>
